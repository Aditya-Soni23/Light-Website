<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scroll Animation</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: auto;
      background-color: #000;
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    /* Lenis smooth scrolling rules */
    html.lenis, html.lenis body {
      height: auto;
    }
    .lenis.lenis-smooth {
      scroll-behavior: auto !important;
    }
    .lenis.lenis-smooth [data-lenis-prevent] {
      overscroll-behavior: contain;
    }
    .lenis.lenis-stopped {
      overflow: hidden;
    }

    /* Scroll track provides the scroll distance */
    .scroll-track {
      height: 600vh;
      width: 100%;
      position: relative;
      pointer-events: none;
    }

    /* Fixed full-screen canvas stage */
    .canvas-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="scroll-track"></div>
  <div class="canvas-viewport">
    <canvas id="frame-canvas"></canvas>
  </div>

  <script src="lenis.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
